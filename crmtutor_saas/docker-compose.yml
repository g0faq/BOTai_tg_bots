services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    expose:
      - "8001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/crmtutor.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt/www:/var/www/certbot
      - ./deploy/letsencrypt/conf:/etc/letsencrypt

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./deploy/letsencrypt/www:/var/www/certbot
      - ./deploy/letsencrypt/conf:/etc/letsencrypt
