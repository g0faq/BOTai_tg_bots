[project]
name = "tutor-telegram-bot"
version = "0.1.0"
description = "Telegram bot MVP for tutor schedule, homework, payments, and student progress."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4",
    "fastapi>=0.111,<1",
    "google-api-python-client>=2.130,<3",
    "google-auth>=2.29,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.4,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
tutor_bot = ["web/static/*"]
