[project]
name = "crmtutor-saas"
version = "0.1.0"
description = "Multi-tenant CRM Tutor SaaS for crmtutor.ru with Telegram Mini App compatible API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.1,<3",
    "fastapi>=0.111,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.4,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
extend-ignore = ["B008"]

[tool.setuptools.package-data]
crmtutor_saas = ["web/static/*"]
