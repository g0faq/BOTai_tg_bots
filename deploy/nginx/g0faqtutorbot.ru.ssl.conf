limit_req_zone $binary_remote_addr zone=tutor_webapp:10m rate=10r/s;

server {
    listen 80;
    server_name g0faqtutorbot.ru www.g0faqtutorbot.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name g0faqtutorbot.ru www.g0faqtutorbot.ru;

    ssl_certificate /etc/letsencrypt/live/g0faqtutorbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/g0faqtutorbot.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        limit_req zone=tutor_webapp burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
