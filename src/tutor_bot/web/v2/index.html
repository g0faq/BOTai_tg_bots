<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>БОТай CRM</title>
    <!-- Один файл вместо тридцати: edge обрывает часть запросов, и модульная
         загрузка почти никогда не доходила целиком. Пересобрать:
         python3 tools/build_v2.py -->
    <link rel="stylesheet" href="./bundle.css" />
    <style>
      /* Запас снизу: таббар плюс кнопка «+», иначе она перекрывает
         последнюю строку списка. */
      body { padding-bottom: calc(var(--tabbar) + var(--fab) + var(--space-6) + env(safe-area-inset-bottom)); }
      #root { max-width: 560px; margin: 0 auto; }
      .app-body { display: block; }
      .toast-host { position: fixed; left: var(--gutter); right: var(--gutter);
        bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + var(--space-3)); z-index: 20; }
      .toast-host:empty { display: none; }
    </style>
    <script src="/assets/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
